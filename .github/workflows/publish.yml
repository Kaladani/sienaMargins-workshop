name: Publish book

# Rebuilds the site and publishes it whenever anything lands on main, so that
# editing a chapter and pushing is all that is needed -- no local Quarto, no
# `quarto publish`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The chunk output committed in _freeze/ is reused rather than recomputed,
      # so RSiena, metafor, ggplot2 and the data are all unnecessary here.  R is
      # still needed, with knitr and rmarkdown, because Quarto starts the knitr
      # engine for any chapter whose source has changed even when it then reuses
      # the cache.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr and rmarkdown
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
